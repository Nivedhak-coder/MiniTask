{% extends "base.html" %}

{% block title %}Edit Task - Nivqora Task{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Task</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.title }}
        {{ form.due_at }}
        {{ form.remind_before }}
        {{ form.repeat }}
        <button type="submit">Save changes</button>
    </form>
    <p><a href="{% url 'tasks' %}">Cancel</a></p>
</div>
{% endblock %}
