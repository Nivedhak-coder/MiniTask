{% extends "base.html" %}

{% block title %}Edit Task - Nivqora Task{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Task</h2>
    <form method="POST">
        {% csrf_token %}
        <label class="f-wide">Task {{ form.title }}</label>
        <label>Due date &amp; time {{ form.due_at }}</label>
        <label>Remind me {{ form.remind_before }}</label>
        <label>Repeat {{ form.repeat }}</label>
        <button type="submit">Save changes</button>
    </form>
    <p><a href="{% url 'tasks' %}">Cancel</a></p>
</div>
{% endblock %}
