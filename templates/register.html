{% extends "base.html" %}

{% block title %}Register - MiniTask{% endblock %}

{% block content %}

<div class="card">

    <h2>Create Account</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>
    </form>

    <p>
        Already have an account?
        <a href="/login/">Login</a>
    </p>

</div>

{% endblock %}
